# CI: offline by design. No secrets: every LLM step runs in mock mode, collectors use MockTransport fixtures.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LLM_MOCK: "true"
  UV_VERSION: "0.11.29"      # keep in step with the uv image pinned in the Dockerfile
  NODE_VERSION: "24"

jobs:
  pytest:
    name: pytest (SQLite + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: paindisc
          POSTGRES_PASSWORD: paindisc
          POSTGRES_DB: paindisc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paindisc -d paindisc_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Postgres-only tests skip without this; here they run against the service container.
      PAINDISC_TEST_DATABASE_URL: postgresql://paindisc:paindisc@127.0.0.1:5432/paindisc_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q

  frontend:
    name: frontend (lint, test, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint        # safety lint: no raw HTML sinks etc.
      - run: npm test -- --run
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: uv sync --frozen
      - run: scripts/e2e.sh
        env:
          E2E_INSTALL_BROWSERS: "true"
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: docker (build + compose smoke + e2e on Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Host tools for the Playwright `docker` project: it reseeds the stack's Postgres with `uv run paindisc demo`.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: uv sync --frozen
      - run: npm --prefix e2e ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: docker build -t paindisc:smoke .
      - run: scripts/docker-smoke.sh
        env:
          SMOKE_SKIP_BUILD: "1"
          SMOKE_E2E: "1"
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-docker
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
