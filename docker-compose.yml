# Venture Engine / paindisc: Postgres + pgvector, API + review UI, weekly scheduler.
#   docker compose up -d --build          # db, migrate (one-shot), api, scheduler
#   open http://127.0.0.1:8000
# Every port is published on 127.0.0.1 only. See docs/deployment.md before exposing anything.
# Secrets come from .env (optional, never baked into the image).

name: paindisc

x-app: &app
  image: ${PAINDISC_IMAGE:-paindisc:local}
  build:
    context: .
  env_file:
    - path: ${PAINDISC_ENV_FILE:-.env}
      required: false
  environment: &app-env
    # Settings here win over .env so the containers always talk to the compose database.
    DATABASE_URL: postgresql://${POSTGRES_USER:-paindisc}:${POSTGRES_PASSWORD:-paindisc}@db:5432/${POSTGRES_DB:-paindisc}
    PAINDISC_HOME: /app
    LLM_MOCK: ${LLM_MOCK:-}
  volumes:
    - data:/app/data
    - reports:/app/reports
    # The registry is the access control: read it from the checkout so edits apply on restart, no rebuild.
    - ./config:/app/config:ro
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paindisc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paindisc}
      POSTGRES_DB: ${POSTGRES_DB:-paindisc}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["paindisc", "db", "migrate"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *app-env
      PAINDISC_API_HOST: 0.0.0.0
      PAINDISC_API_PORT: "8000"
    ports:
      - "127.0.0.1:${PAINDISC_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *app
    command: ["scripts/scheduler.sh"]
    environment:
      <<: *app-env
      WEEKLY_CRON: ${WEEKLY_CRON:-0 6 * * 1}   # Monday 06:00 in WEEKLY_TZ
      WEEKLY_TZ: ${WEEKLY_TZ:-UTC}             # e.g. Asia/Kolkata
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  data:
  reports:
