[project]
name = "venture-engine"
version = "0.1.0"
description = "Venture Engine: agentic market research. First module: paindisc, the pain discovery agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "datasketch>=2.0",
    "fastapi>=0.115",
    "httpx>=0.28",
    "numpy>=2.0",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "scikit-learn>=1.5",
    "typer>=0.12",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]

[project.scripts]
paindisc = "paindisc.cli:app"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paindisc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
